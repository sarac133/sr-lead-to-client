<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meta Ads proposal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Meta Ads proposal (blank)" style="display: {{sd}}; position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; container-type: inline-size; background-color: #FFFFFF"></section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"slide":{"editor":null},"mode":{"editor":null},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    // mode "deck" (Lead to Client): the slide. mode "notes" (presenter view): no slide, notes only. No mode: the slide on this artboard.
    return { sd: this.props.mode === 'notes' ? 'none' : 'block' };
  }
}
</script>
</body>
</html>
