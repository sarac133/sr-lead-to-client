<script type="text/x-dc" data-dc-script data-props='{"live":{"editor":null},"active":{"editor":null},"$preview":{"width":1920,"height":1080}}'>
// FX: figures are written in USD and converted by location. Rates are units per 1 USD; edit them when the market moves.
const RATE = { USD: 1, GBP: 0.74, EUR: 0.87, AED: 3.6725, HKD: 7.8, THB: 33.8 };
const SYM = { USD: '$', GBP: '£', EUR: '€', AED: 'AED ', HKD: 'HK$', THB: 'THB ' };
const curOf = (p) => String((p && p.cur) || 'USD').toUpperCase();
const kfmt = (usd, cur) => { const v = usd * (RATE[cur] || 1), sym = SYM[cur] || '$', k = v / 1000; if (k >= 1000) return sym + String(Math.ceil(v / 1e4 - 1e-9) / 100) + 'M'; return sym + (k >= 10 ? Math.ceil(k - 1e-9) : Math.ceil(k * 10 - 1e-9) / 10) + 'k'; };
const nice = (x, up) => { if (!(x > 0)) return 0; const m = Math.pow(10, Math.floor(Math.log10(x)) - 1); const r = x / m; return Math.round(up ? Math.ceil(r - 1e-9) : Math.round(r)) * m; };
const nstep = (x) => { const m = Math.pow(10, Math.floor(Math.log10(x))); const r = x / m; return (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * m; };
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: null, ph: 0, k: 0, p: 0 };
this.R = [
{ label: 'INBOUND LOG', kind: 'count', size: 230, sub: 'enquiries in 35 days, from expats ready to buy.', steps: [
{ t: 'Found their real buyer', x: 'Our CIA Insight Method showed us exactly who buys, and why.' },
{ t: 'Met them where they scroll', x: 'We put the message where those expats already spend their time.' },
{ t: 'Built the path to enquire', x: 'Every step from first look to enquiry, planned so nobody drops off.' },
{ t: 'The Insurer vs Broker funnel', x: 'Side by side, going through a broker became a no-brainer.' }] },
{ label: 'LOCAL GROUND', kind: 'rank', size: 230, sub: 'The first insurer local expats find when they search nearby.', steps: [
{ t: 'Spotted the local demand', x: 'Expats nearby were searching for a broker every month.' },
{ t: 'Studied who was winning', x: 'We found what the top players did, and the gap they left.' },
{ t: 'Fixed their online presence', x: 'Profile, reviews and website, rebuilt to win local searches.' }] },
{ label: 'HIGH GROUND', kind: 'race', size: 100, sub: 'Recommended by ChatGPT and Gemini, ahead of AXA and Cigna.', steps: [
{ t: 'Spotted the shift', x: 'Expats now ask AI to explain insurance for them.' },
{ t: 'Knew their questions', x: 'We knew exactly what our audience was asking.' },
{ t: 'Got there first', x: 'We made them the answer before the big brands caught on.' }] },
{ label: 'RETENTION', kind: 'text', size: 118, sub: 'A brand new app that brings past clients back to buy more.', steps: [
{ t: 'Found the blind spot', x: 'Everyone chases new clients and forgets the ones they have.' },
{ t: 'Found the lost revenue', x: 'Past clients were slipping away without ever being offered more.' },
{ t: 'Built the comeback system', x: 'A custom app and funnel that brings past clients back to buy.' }] }
];
this.play = () => {
this.stopPlay();
this.setState({ k: 0, p: 0 });
const r = this.R[this.state.sel != null ? this.state.sel : 0];
const n = r.steps.length;
this.timers = [];
for (let i = 1; i <= n; i++) this.timers.push(setTimeout(() => this.setState({ k: i }), 250 + i * 380));
this.timers.push(setTimeout(() => {
const t0 = performance.now();
const tick = (now) => {
const t = Math.min(1, (now - t0) / 1900);
this.setState({ p: 1 - Math.pow(1 - t, 3) });
if (t < 1) this.praf = requestAnimationFrame(tick);
};
this.praf = requestAnimationFrame(tick);
}, 300));
};
this.stopPlay = () => { (this.timers || []).forEach((id) => clearTimeout(id)); this.timers = []; cancelAnimationFrame(this.praf); };
this.openX = (i) => () => { clearTimeout(this.tm); this.stopPlay(); this.setState({ sel: i, ph: 0, k: 0, p: 0 }); this.tm = setTimeout(() => { this.setState({ ph: 1 }); this.play(); }, 40); };
this.closeX = () => { clearTimeout(this.tm); this.stopPlay(); this.setState({ ph: 0 }); this.tm = setTimeout(() => this.setState({ sel: null }), 620); };
this.stepX = (dir) => () => { const n = this.R.length; this.setState({ sel: (this.state.sel + dir + n) % n, k: 0, p: 0 }); setTimeout(() => this.play(), 30); };
this.run = () => {
cancelAnimationFrame(this.raf);
clearTimeout(this.ctT);
this.setState({ ct: 0 });
this.ctT = setTimeout(() => {
const t0 = performance.now();
const step = (now) => {
const t = Math.min(1, (now - t0) / 1600);
this.setState({ ct: 1 - Math.pow(1 - t, 3) });
if (t < 1) this.raf = requestAnimationFrame(step);
};
this.raf = requestAnimationFrame(step);
}, 550);
};
}
componentDidMount() {
if (this.props.live && this.props.active) this.run();
}
componentDidUpdate(prev) {
const was = !!(prev && prev.active);
const now = !!this.props.active;
if (this.props.live && now && !was) this.run();
if (was && !now) {
clearTimeout(this.tm); clearTimeout(this.ctT); cancelAnimationFrame(this.raf); this.stopPlay();
this.setState({ sel: null, ph: 0, q: undefined, ct: 0, k: 0, p: 0 });
}
}
componentWillUnmount() { clearTimeout(this.tm); clearTimeout(this.ctT); cancelAnimationFrame(this.raf); this.stopPlay(); }
renderVals() {
const live = !!this.props.live;
const on = !live || !!this.props.active;
const st = this.state;
const open = st.q !== undefined ? st.q : !live;
const ct = live ? (st.ct === undefined ? 1 : st.ct) : 1;
const sel = st.sel;
const has = sel != null;
const r = has ? this.R[sel] : this.R[0];
const xs = [134, 555, 976, 1397];
const src = { x: xs[has ? sel : 0], y: 340, w: 389, h: 400 };
const dst = { x: 0, y: 0, w: 1920, h: 1080 };
const n = r.steps.length;
const p = live ? st.p : 1;
const k = live ? st.k : n;
let big = r.kind === 'count' ? Math.round(1400 * p).toLocaleString('en-US') : r.kind === 'rank' ? 'Top ' + Math.max(3, Math.round(20 - 17 * p)) : r.kind === 'race' ? 'Beat top brands' : 'Upsell system';
const won = p > 0.55;
const names = [{ name: 'AXA', me: false }, { name: 'CIGNA', me: false }, { name: 'YOUR BROKER', me: true }];
const order = won ? [2, 0, 1] : [0, 1, 2];
const board = names.map((x, i) => { const pos = order.indexOf(i); return { name: x.name, rank: String(pos + 1), y: pos * 80, bg: x.me ? '#C6A667' : 'rgba(255,255,255,0.08)', fg: x.me ? '#142C49' : 'rgba(255,255,255,0.7)' }; });
return {
trip: SYM[curOf(this.props)] + Math.ceil(65 * (RATE[curOf(this.props)] || 1) - 1e-9).toLocaleString('en-US'),
rootClass: on ? 'srs on' : 'srs',
qClass: open ? 'qband' : 'qband qc',
toggleQ: () => this.setState({ q: !open }),
n1: Math.round(1400 * ct).toLocaleString('en-US'),
n3: Math.round(50 * ct),
barW: Math.round(100 * ct),
xOn: has,
xr: st.ph ? dst : src,
xBack: st.ph ? 'xbk on' : 'xbk',
xc: st.ph ? 'xpc on' : 'xpc',
d: { num: String((has ? sel : 0) + 1).padStart(2, '0'), label: r.label, sub: r.sub, size: r.size, race: r.kind === 'race' },
big: big,
resCls: 'resn' + (p >= 1 ? ' done' : '') + (r.kind === 'race' || r.kind === 'text' ? (p > 0 ? ' txt on' : ' txt') : ''),
lineCls: 'resl' + (p >= 1 ? ' on' : ''),
lineH: n ? Math.round(k / n * 100) : 0,
board: board,
steps: r.steps.map((t, i) => ({ t: t.t, x: t.x, cls: 'stp2' + (i < k ? ' on' : '') })),
closeX: this.closeX,
prevX: this.stepX(-1),
nextX: this.stepX(1),
o0: this.openX(0), o1: this.openX(1), o2: this.openX(2), o3: this.openX(3),
keyX: (e) => {
if (e.target && e.target.tagName === 'INPUT') { e.stopPropagation(); return; }
if (st.sel == null) return;
const k = e.key;
if (k === 'Escape') { e.stopPropagation(); e.preventDefault(); this.closeX(); }
else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') { e.stopPropagation(); e.preventDefault(); this.stepX(1)(); }
else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.stopPropagation(); e.preventDefault(); this.stepX(-1)(); }
}
};
}
}
</script>
