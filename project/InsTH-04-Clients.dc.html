<div class="{{fade}}">
<div style="position: absolute; left: 120px; top: 64px; width: 1680px; display: flex; align-items: center; justify-content: space-between">
<button class="xbtn light" onClick="{{closeX}}" style="width: auto; padding: 0 18px; font-size: 16px">← All clients</button>
<div style="font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #1E3A5F">CLIENT {{d.num}} / 18</div>
</div>
</div>
<sc-for list="{{cards}}" as="c" hint-placeholder-count="18">
<button class="cc" onClick="{{c.pick}}" aria-label="{{c.aria}}" tabIndex="{{c.tab}}" style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: {{c.h}}px; opacity: {{c.o}}; z-index: {{c.z}}; pointer-events: {{c.pe}}; padding: 0; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: {{c.sh}}; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer">
<sc-if value="{{c.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{c.img}}" alt="" style="width: 62%; height: 62%; object-fit: contain"></sc-if>
<sc-if value="{{c.noImg}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 8%; font-family: Georgia, 'Times New Roman', serif; font-size: {{c.fs}}px; line-height: 1.2; color: #1E3A5F; text-align: center">{{c.name}}</span></sc-if>

<div class="{{fade}}">

<button class="xbtn navy" onClick="{{nextX}}" aria-label="Next client" style="position: absolute; left: 1244px; top: 302px; z-index: 6">›</button>
<div style="position: absolute; left: 260px; top: 535px; width: 1400px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<h2 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 72px; line-height: 1.05; letter-spacing: -1.4px; color: #17140F">{{d.name}}</h2>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
<sc-if value="{{d.hasWhat}}" hint-placeholder-val="{{ true }}"><div style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 20px; background: #EAE4D6; font-size: 16px; color: #3F3A32">{{d.what}}</div></sc-if>
<sc-if value="{{d.hasMarket}}" hint-placeholder-val="{{ true }}"><div style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 20px; background: #EAE4D6; font-size: 16px; color: #3F3A32">{{d.market}}</div></sc-if>
<sc-if value="{{d.hasServices}}" hint-placeholder-val="{{ true }}"><div style="height: 40px; padding: 0 18px; display: flex; align-items: center; border-radius: 20px; background: #142C49; font-size: 16px; color: #FFFFFF">{{d.services}}</div></sc-if>
</div>
<sc-if value="{{d.hasResult}}" hint-placeholder-val="{{ true }}"><div style="margin-top: 10px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 36px; line-height: 1.25; color: #142C49; max-width: 1240px">{{d.result}}</div></sc-if>
<sc-if value="{{d.hasQuote}}" hint-placeholder-val="{{ false }}">
<div style="max-width: 1100px; display: flex; flex-direction: column; gap: 6px"><div style="font-family: Georgia, 'Times New Roman', serif; font-size: 21px; line-height: 1.4; color: #3F3A32">“{{d.quote}}”</div><div style="font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #8A6A2E">{{d.by}}</div></div>
</sc-if>
<sc-if value="{{d.hasDid}}" hint-placeholder-val="{{ false }}"><button class="xbtn light" onClick="{{toggleHow}}" style="width: auto; padding: 0 22px; height: 48px; font-size: 16px; font-weight: 700">{{d.howLabel}}</button></sc-if>
<sc-if value="{{d.howOn}}" hint-placeholder-val="{{ false }}">
<div class="co" style="max-width: 1000px; font-size: 21px; line-height: 1.55; color: #3F3A32">{{d.did}}</div>
</sc-if>
</div>
<div style="position: absolute; left: 0px; top: 1012px; width: 1920px; display: flex; justify-content: center; gap: 8px">
<sc-for list="{{dots}}" as="t" hint-placeholder-count="18"><button class="{{t.cls}}" onClick="{{t.pick}}" aria-label="{{t.aria}}"></button></sc-for>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"live":{"editor":null},"active":{"editor":null},"$preview":{"width":1920,"height":1080}}'>
// FX: figures are written in USD and converted by location. Rates are units per 1 USD; edit them when the market moves.
const RATE = { USD: 1, GBP: 0.74, EUR: 0.87, AED: 3.6725, HKD: 7.8, THB: 33.8 };
const SYM = { USD: '$', GBP: '£', EUR: '€', AED: 'AED ', HKD: 'HK$', THB: 'THB ' };
const curOf = (p) => String((p && p.cur) || 'USD').toUpperCase();
const kfmt = (usd, cur) => { const v = usd * (RATE[cur] || 1), sym = SYM[cur] || '$', k = v / 1000; if (k >= 1000) return sym + String(Math.ceil(v / 1e4 - 1e-9) / 100) + 'M'; return sym + (k >= 10 ? Math.ceil(k - 1e-9) : Math.ceil(k * 10 - 1e-9) / 10) + 'k'; };
const nice = (x, up) => { if (!(x > 0)) return 0; const m = Math.pow(10, Math.floor(Math.log10(x)) - 1); const r = x / m; return Math.round(up ? Math.ceil(r - 1e-9) : Math.round(r)) * m; };
const nstep = (x) => { const m = Math.pow(10, Math.floor(Math.log10(x))); const r = x / m; return (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * m; };
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: null, ph: 0, how: false };
this.C = [
{ name: 'Atoms to Astronauts', img: '', what: '', market: '', services: 'Meta Ads', did: 'Restructured their Facebook ad campaign to lower the cost per sale, without increasing the ad budget.', result: '$14k through Meta Ads in 7 days', quote: '', by: '' },
{ name: 'Regency for Expats', img: 'insth-assets/903e9810d693.png', what: 'Expat insurance provider', market: '', services: 'AEO · Paid ads', did: '', result: '', quote: '', by: '' },
{ name: 'Elite', img: 'insth-assets/828e9180a7d4.png', what: '', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'NowCompare', img: 'insth-assets/8b7dc390f11f.png', what: '', market: '', services: 'Email campaign · Landing page', did: 'Ran an email campaign for their wellbeing offer, with a landing page that converted at 30%.', result: '4,300 enquiries and a 30% converting landing page in 85 days', quote: '', by: '' },
{ name: 'Paradise Pool Services', img: 'insth-assets/847755d48000.png', what: 'Pool servicing', market: 'Washington, US', services: 'SEO · AEO', did: '', result: '$87k through an organic growth partnership in 32 days', quote: '', by: '' },
{ name: 'AA Insurance Brokers', img: 'insth-assets/d88e3b4cc882.png', what: '', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'Wise Men Insurance', img: 'insth-assets/eb9e90e68ac7.png', what: 'Insurance', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'Lifestyle Insurance', img: 'insth-assets/0120500e4e70.png', what: 'Health insurance broker', market: 'Hong Kong', services: 'SEO · AI visibility', did: 'SEO and AI visibility work to get them found on Google and recommended by AI search.', result: 'Search traffic from 5 to 665 monthly visitors in 1 month, now ranking above AXA on Gemini and AI Overview', quote: 'My search traffic went from 5 monthly visitors to 665, and I am now ranking above AXA on Gemini and AI Overview.', by: 'Operations Director, Lifestyle Insurance' },
{ name: "Sotheby's International Realty", img: 'insth-assets/ac4b95e47cf1.png', what: 'Real estate', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'Group 4 Safe Deposit Boxes', img: 'insth-assets/0179ebd68bf8.png', what: 'Safe deposit boxes', market: '', services: 'Google Ads', did: 'Planned, built and launched their Google Ads campaign.', result: 'Google Ads campaign launched in 4 days', quote: '', by: '' },
{ name: 'Atrium HR Consulting', img: 'insth-assets/aeb5f26283c8.png', what: 'International HR and recruitment', market: 'Hong Kong', services: 'SEO · AEO · Outbound sales', did: 'SEO and AI visibility to get them found online, plus an outbound sales system to win new placements.', result: '$16k through a sales growth partnership in 32 days', quote: 'We have gone from invisible online to ranking in the top 10 across Google and Bing.', by: 'CEO, Atrium HR Consulting' },
{ name: 'Alliance Property Investments', img: 'insth-assets/5bad3d066f86.png', what: 'Property investment', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'Savills', img: 'insth-assets/865db410ad45.png', what: 'Real estate', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'AA World', img: 'insth-assets/ec74b5206baa.png', what: 'Health insurance', market: '', services: 'Meta Ads', did: 'Social media advertising that brought in qualified health insurance leads.', result: '1,400 health insurance enquiries through Meta Ads in 35 days', quote: 'The best account management I have ever seen.', by: 'AA World' },
{ name: 'Business Class Asia', img: 'insth-assets/2d594f62b4c9.png', what: '', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'Helios Homes', img: 'insth-assets/333fbb7bec4f.png', what: 'Real estate', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'MJEaton Property Services', img: '', what: 'Property services', market: '', services: '', did: '', result: '', quote: '', by: '' },
{ name: 'Bayshore Home Buyers', img: 'insth-assets/bb99bf600224.png', what: 'Home buyers', market: '', services: 'Website design', did: 'Designed and built their full website.', result: 'Full website design in 7 days', quote: '', by: '' }
];
this.SLOT = {
'0': { x: 700, y: 160, w: 520, h: 340, o: 1, z: 5 },
'-1': { x: 350, y: 215, w: 340, h: 230, o: 0.6, z: 4 },
'1': { x: 1230, y: 215, w: 340, h: 230, o: 0.6, z: 4 },
'-2': { x: 70, y: 260, w: 240, h: 140, o: 0.35, z: 3 },
'2': { x: 1610, y: 260, w: 240, h: 140, o: 0.35, z: 3 },
'-3': { x: -300, y: 260, w: 240, h: 140, o: 0, z: 2 },
'3': { x: 1980, y: 260, w: 240, h: 140, o: 0, z: 2 }
};
this.openX = (i) => () => { clearTimeout(this.tm); this.setState({ sel: i, ph: 0, how: false }); this.tm = setTimeout(() => this.setState({ ph: 1 }), 40); };
this.closeX = () => { clearTimeout(this.tm); this.setState({ ph: 0, how: false }); this.tm = setTimeout(() => this.setState({ sel: null }), 650); };
this.stepX = (dir) => () => { const n = this.C.length; this.setState({ sel: (this.state.sel + dir + n) % n, how: false }); };
this.goTo = (i) => () => { if (this.state.ph) this.setState({ sel: i, how: false }); };
this.toggleHow = () => this.setState({ how: !this.state.how });
}
componentDidUpdate(prev) {
if (prev && prev.active && !this.props.active && this.state.sel != null) { clearTimeout(this.tm); this.setState({ sel: null, ph: 0, how: false }); }
}
componentWillUnmount() { clearTimeout(this.tm); }
renderVals() {
const live = !!this.props.live;
const on = !live || !!this.props.active;
const st = this.state;
const sel = st.sel;
const has = sel != null;
const n = this.C.length;
const c = this.C[has ? sel : 0];
const cards = this.C.map((cl, i) => {
let d = ((i - (has ? sel : 0)) % n + n) % n;
if (d > n / 2) d -= n;
const key = String(Math.max(-3, Math.min(3, d)));
let s = this.SLOT[key];
if (!st.ph) {
if (i === sel) {
const col = i % 6, row = Math.floor(i / 6);
s = { x: 140 + col * 277, y: 366 + row * 172, w: 255, h: 150, o: 1, z: 5 };
} else {
s = Object.assign({}, s, { o: 0 });
}
}
const near = Math.abs(d) <= 2 && st.ph;
return {
x: s.x, y: s.y, w: s.w, h: s.h, o: s.o, z: s.z,
pe: near ? 'auto' : 'none',
tab: near ? 0 : -1,
sh: d === 0 ? '0 40px 80px rgba(20,44,73,0.18)' : '0 10px 24px rgba(20,44,73,0.08)',
img: cl.img, hasImg: !!cl.img, noImg: !cl.img, name: cl.name,
fs: d === 0 ? 40 : 20,
aria: d === 0 ? cl.name : 'Show ' + cl.name,
pick: d === 0 ? this.toggleHow : this.goTo(i)
};
});
const dots = this.C.map((cl, i) => ({ cls: i === sel ? 'cdot on' : 'cdot', aria: 'Show ' + cl.name, pick: this.goTo(i) }));
const out = {
rootClass: on ? 'srs on' : 'srs',
xOn: has,
xBack: st.ph ? 'xbk on' : 'xbk',
fade: st.ph ? 'fadein on' : 'fadein',
cards: cards,
dots: dots,
d: { num: String((has ? sel : 0) + 1).padStart(2, '0'), name: c.name, what: c.what, market: c.market, services: c.services, result: String(c.result || '').replace(/\$(\d+)k/g, (m, n) => kfmt(Number(n) * 1000, curOf(this.props))), did: c.did, quote: c.quote, by: c.by, hasQuote: !!c.quote, hasWhat: !!c.what, hasMarket: !!c.market, hasServices: !!c.services, hasResult: !!c.result, hasDid: !!c.did, howOn: !!st.how && !!c.did, howLabel: st.how ? '− Hide' : '+ How we did it' },
closeX: this.closeX,
toggleHow: this.toggleHow,
prevX: this.stepX(-1),
nextX: this.stepX(1),
keyX: (e) => {
if (e.target && e.target.tagName === 'INPUT') { e.stopPropagation(); return; }
if (st.sel == null) return;
const k = e.key;
if (k === 'Escape') { e.stopPropagation(); e.preventDefault(); this.closeX(); }
else if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') { e.stopPropagation(); e.preventDefault(); this.stepX(1)(); }
else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.stopPropagation(); e.preventDefault(); this.stepX(-1)(); }
}
};
for (let i = 0; i < 18; i++) out['o' + i] = this.openX(i);
return out;
}
}
</script>
</body>
</html>
