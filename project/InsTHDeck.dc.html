<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":null},"cur":{"editor":null},"onMove":{"editor":null},"cmd":{"editor":null},"hidden":{"editor":null},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
const RE = props && props.variant === 're';
this.RE = RE;
this.SECS = [
{ n: '01', t: 'Introduction', s: 1 },
{ n: '02', t: 'Who we are', s: 2 },
{ n: '03', t: 'Our clients', s: 1 },
{ n: '04', t: 'Results', s: 1 },
{ n: '05', t: RE ? 'Case study · Real estate' : 'Case study · Insurance, Asia', s: 3 },
{ n: '06', t: 'Before we build your proposal', s: 1 }
];
this.POS = [[720, 1000], [2880, 1000], [5040, 1000], [720, 2560], [2880, 2560], [5040, 2560]];
this.state = { view: 'slide', sec: 0, pos: [0, 0, 0, 0, 0, 0], building: false, hud: true, mv: '' };
this.lockUntil = 0;
this.BASE = [0, 1, 3, 4, 5, 8];
this.FLAT = [[0, 0], [1, 0], [1, 1], [2, 0], [3, 0], [4, 0], [4, 1], [4, 2], [5, 0]];
this.isHid = (i) => { const h = this.props && this.props.hidden; return Array.isArray(h) && h.indexOf(i) >= 0; };
this.timers = [];
this.later = (fn, ms) => { this.timers.push(setTimeout(fn, ms)); };
this.clearAll = () => { this.timers.forEach((id) => clearTimeout(id)); this.timers = []; };
this.goTo = (sec, idx, dir) => {
this.clearAll();
const pos = this.state.pos.slice();
pos[sec] = idx;
const fromHub = this.state.view === 'hub';
const chap = sec !== this.state.sec && !fromHub;
const mv = chap ? (dir ? dir + sec : '') : (fromHub ? '' : this.state.mv);
if (chap) this.lockUntil = Date.now() + 1100;
this.setState({ view: 'slide', sec: sec, pos: pos, building: true, mv: mv });
this.later(() => this.setState({ building: false }), chap ? 1250 : 650);
};
this.fly = (sec, idx) => {
this.clearAll();
const pos = this.state.pos.slice();
pos[sec] = idx;
this.setState({ view: 'hub', sec: sec, pos: pos, building: false });
this.later(() => this.goTo(sec, idx), 1400);
};
this.next = () => {
if (Date.now() < this.lockUntil) return;
const st = this.state;
if (st.view === 'hub') { this.open(st.sec)(); return; }
const cur = this.BASE[st.sec] + st.pos[st.sec];
for (let i = cur + 1; i < this.FLAT.length; i++) {
if (this.isHid(i)) continue;
const t = this.FLAT[i];
this.goTo(t[0], t[1], t[0] !== st.sec ? 'f' : undefined);
return;
}
this.clearAll();
this.setState({ view: 'hub', mv: '' });
};
this.prev = () => {
if (Date.now() < this.lockUntil) return;
const st = this.state;
if (st.view === 'hub') return;
const cur = this.BASE[st.sec] + st.pos[st.sec];
for (let i = cur - 1; i >= 0; i--) {
if (this.isHid(i)) continue;
const t = this.FLAT[i];
this.goTo(t[0], t[1], t[0] !== st.sec ? 'b' : undefined);
return;
}
};
this.overview = () => { this.clearAll(); this.setState({ view: 'hub', building: false, mv: '' }); };
this.open = (k) => () => {
const n = this.SECS[k].s, b = this.BASE[k];
let p = this.state.pos[k];
if (this.isHid(b + p)) { p = -1; for (let j = 0; j < n; j++) { if (!this.isHid(b + j)) { p = j; break; } } }
if (p < 0) return;
this.goTo(k, p);
};
this.openCase = () => this.goTo(4, 0);
this.onKey = (e) => {
const k = e.key;
if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown') { e.preventDefault(); this.next(); }
else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); this.prev(); }
else if (k === 'Escape' || k === 'o' || k === 'O') { e.preventDefault(); this.overview(); }
};
this.wake = () => {
if (!this.state.hud) this.setState({ hud: true });
clearTimeout(this.hudT);
this.hudT = setTimeout(() => this.setState({ hud: false }), 2800);
};
this.rootRef = (el) => { this.rootEl = el; };
}
componentDidMount() {
this.wake();
if (this.rootEl && this.rootEl.focus) { try { this.rootEl.focus({ preventScroll: true }); } catch (e) {} }
}
componentDidUpdate() {
const st = this.state;
const hub = st.view === 'hub';
const base = [0, 1, 3, 4, 5, 8][st.sec];
const idx = hub ? -1 : base + st.pos[st.sec];
const key = (hub ? 'h' : 's') + idx;
if (key !== this.lastKey) {
this.lastKey = key;
if (typeof this.props.onMove === 'function') { try { this.props.onMove(idx); } catch (e) {} }
}
const cmd = this.props.cmd;
if (cmd && cmd.id !== this.lastCmd) {
this.lastCmd = cmd.id;
if (cmd.hub) this.overview();
else if (typeof cmd.sec === 'number') this.goTo(cmd.sec, cmd.pos || 0);
else if (typeof cmd.step === 'number') { if (cmd.step > 0) this.next(); else this.prev(); }
}
}
componentWillUnmount() {
this.clearAll();
clearTimeout(this.hudT);
}
renderVals() {
this.RE = !!(this.props && this.props.variant === 're');
if (this.SECS) this.SECS[4].t = this.RE ? 'Case study · Real estate' : 'Case study · Insurance, Asia';
const st = this.state;
const S = this.SECS;
const hub = st.view === 'hub';
const xy = this.POS[st.sec];
const reV = !!this.RE;
const cam = hub ? 'translate(0px, 0px) scale(0.25)' : 'translate(' + (-xy[0]) + 'px, ' + (-xy[1]) + 'px) scale(1)';
const act = (k, j) => {
const inCur = !hub && k === st.sec;
return !inCur ? true : (j === st.pos[k] && !st.building);
};
let gi = 0;
for (let i = 0; i < st.sec; i++) gi += S[i].s;
gi += st.pos[st.sec];
const pip = (k, j) => (st.pos[k] === j ? 'pip on' : 'pip');
const lay = (k, j) => (j < st.pos[k] ? 'layer past' : (j === st.pos[k] ? 'layer cur' : 'layer fut'));
const tcl = (k) => (hub || k === st.sec ? 'tile' : 'tile dim');
const tile = (k) => (k === st.sec ? 'tilebtn cur' : 'tilebtn');
return {
rootRef: this.rootRef,
isIns: !reV, isRe: reV,
caseHub: reV ? 'Case study · Real estate' : 'Case study · Insurance',
cur: this.props.cur || 'USD', curRe: this.props.cur || 'USD', variantV: reV ? 're' : 'ins',
onKey: this.onKey,
wake: this.wake,
cam: cam,
hub: hub,
rigClass: st.mv ? 'rig ' + st.mv : 'rig',
hubTx: hub ? 'hubtx on' : 'hubtx',
tc0: tcl(0), tc1: tcl(1), tc2: tcl(2), tc3: tcl(3), tc4: tcl(4), tc5: tcl(5),
aMain: act(0, 0),
a02: act(1, 0), a03: act(1, 1),
a04: act(2, 0),
a05: act(3, 0),
a06: act(4, 0), a07: act(4, 1), a08: act(4, 2),
a10: act(5, 0),
l1a: lay(1, 0), l1b: lay(1, 1),
l4a: lay(4, 0), l4b: lay(4, 1), l4c: lay(4, 2),
goNext: this.next,
openCase: this.openCase,
p1a: pip(1, 0), p1b: pip(1, 1),
p4a: pip(4, 0), p4b: pip(4, 1), p4c: pip(4, 2),
t0: tile(0), t1: tile(1), t2: tile(2), t3: tile(3), t4: tile(4), t5: tile(5),
o0: this.open(0), o1: this.open(1), o2: this.open(2), o3: this.open(3), o4: this.open(4), o5: this.open(5),
progW: hub ? 0 : ((gi + 1) / S.reduce((t, x) => t + x.s, 0)) * 100,
hudClass: (hub || st.hud) ? 'hud' : 'hud off',
hudNum: hub ? '' : S[st.sec].n,
hudTitle: hub ? 'Overview' : S[st.sec].t,
hudCount: hub ? '6 chapters · choose one' : ((st.pos[st.sec] + 1) + ' / ' + S[st.sec].s),
prevDis: hub || (st.sec === 0 && st.pos[0] === 0),
overview: this.overview,
prev: this.prev,
next: this.next
};
}
}
</script>
